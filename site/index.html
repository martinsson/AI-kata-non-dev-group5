<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome — Control Software League</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b6b2e 0%, #14953f 50%, #1fb14e 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 18px;
      padding: 3rem 3.5rem;
      backdrop-filter: blur(6px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      max-width: 640px;
    }
    .badge {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.1;
      margin-bottom: 1rem;
    }
    p {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      opacity: 0.92;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Control Software League</span>
    <h1>Welcome to the Control Software League</h1>
    <p>Glad to have you here. Get ready to compete, collaborate, and level up your control software skills.</p>
  </main>
</body>
</html>
